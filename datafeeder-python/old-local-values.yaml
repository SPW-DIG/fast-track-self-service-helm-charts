backend:
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: "georchestra-127-0-1-1.nip.io"

  database:
    existingSecret: "georchestra-database-georchestra-secret"

  datadir:
    local:
      path: ""  # set to an absolute host path to skip git clone, e.g. /mnt/d/env/georchestra/datadir
    git:
      url: https://github.com/georchestra/datadir.git
      ref: "25.0"

  config:
