    secretKey: change-me
    encryptionKey: change-me
    frontend:
      url: https://georchestra-127-0-1-1.nip.io/datafeeder
    corsOrigins: http://localhost:5173
    geoserver:
      username: geoserver_privileged_user
      password: change-me
    geonetwork:
      username: geoserver_privileged_user
      password: change-me
    airflow:
      username: admin
      password: change-me

